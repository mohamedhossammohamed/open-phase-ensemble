[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tsad"
version = "0.1.0"
description = "Non-Parametric Time-Series Anomaly Detection and Forecasting System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "stumpy>=1.11.0",
    "hnswlib>=0.7.0",
    "statsmodels>=0.14.0",
    "pmdarima>=2.0.0",
    "torch>=2.0.0",
    "wfdb>=4.1.0",
    "bayesian-optimization>=1.4.0",
    "matplotlib>=3.7.0",
    "pytest>=7.3.0",
    "requests>=2.28.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tsad"
version = "0.1.0"
description = "Non-Parametric Multi-Tool Ensemble for Time-Series Anomaly Detection and Forecasting"
readme = "README.md"
authors = [{ name = "open-phase-ensemble Contributors" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "scikit-learn>=1.0.0",
    "stumpy>=1.11.0",
    "hnswlib>=0.7.0",
    "statsmodels>=0.13.0",
    "torch>=2.0.0",
    "wfdb>=4.1.0",
    "matplotlib>=3.5.0",
    "pytest>=7.0.0",
    "requests>=2.28.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "pymdown-extensions>=10.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0"
]

[tool.setuptools.packages.find]
where = ["src"]

site_name: open-phase-ensemble
site_description: Non-Parametric Multi-Tool Ensemble for Time-Series Anomaly Detection and Forecasting
site_url: https://mohamedhossammohamed.github.io/open-phase-ensemble/
repo_url: https://github.com/mohamedhossammohamed/open-phase-ensemble
repo_name: open-phase-ensemble

theme:
  name: material
  palette:
    scheme: slate
    primary: black
    accent: teal
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.mark
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/simulation.js

nav:
  - Home: index.md
  - Journey: journey.md
  - Theory: theory.md
  - Research & Citations: citations.md
  - Architecture: architecture.md
  - Results: results.md
  - Significance: significance.md
  - Disclaimer: disclaimer.md
  - Developer Guide: developer.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mohamedhossammohamed/open-phase-ensemble

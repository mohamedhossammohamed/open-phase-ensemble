site_name: open-phase-ensemble Documentation
site_description: Non-Parametric Multi-Tool Ensemble for Time-Series Anomaly Detection and Forecasting
site_url: https://mohamedhossammohamed.github.io/open-phase-ensemble/
repo_url: https://github.com/mohamedhossammohamed/open-phase-ensemble
repo_name: mohamedhossammohamed/open-phase-ensemble

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home / Overview: index.md
  - The Journey: journey.md
  - Theory: theory.md
  - Research and Citations: citations.md
  - Architecture and Specifications: architecture.md
  - Results and Benchmarks: results.md
  - Significance: significance.md
  - Disclaimer and Review Status: disclaimer.md
  - Developer Documentation: developer.md
